[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipdraft"
version = "0.1.0"
description = "AI 自动剪辑 Agent 技能包（SKILL.md 驱动，含素材分析与 Resolve 时间线构建脚本）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# 本仓库以技能包形态分发，不构建同名 Python 包；pyproject 主要提供
# 项目元数据与 pytest 配置，脚本位于 skills/autoedit-agent/scripts/。
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
